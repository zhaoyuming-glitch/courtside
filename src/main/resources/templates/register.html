<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COURTSIDE — 注册</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #f4f4f4;
            --text: #0a0a0a;
            --accent: #ff1a1a;
            --card-bg: #ffffff;
            --border: #0a0a0a;
            --shadow: 8px 8px 0px rgba(0, 0, 0, 0.06);
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: "Helvetica Neue", Arial, "PingFang SC", sans-serif;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        h1, h2, h3, h4 { font-weight: 900; text-transform: uppercase; letter-spacing: -0.5px; }

        .nav {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            height: 60px; display: flex; align-items: center;
            justify-content: space-between; padding: 0 40px;
            background: var(--bg); border-bottom: 3px solid var(--border);
        }
        .nav-logo {
            font-size: 20px; font-weight: 900; letter-spacing: -1px;
            text-transform: uppercase; display: flex; align-items: center;
            gap: 8px; text-decoration: none; color: var(--text);
        }
        .nav-logo::before {
            content: ''; width: 12px; height: 12px;
            background: var(--accent); transform: skewX(-15deg);
        }
        .nav-links {
            display: flex; gap: 32px; font-size: 12px; font-weight: 900;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .nav-links a {
            text-decoration: none; color: var(--text); padding: 4px 0;
            border-bottom: 3px solid transparent; transition: border-color 0.1s;
        }
        .nav-links a:hover { border-bottom-color: var(--text); }
        .nav-links a.active { border-bottom-color: var(--accent); }

        .bg-deco {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0; overflow: hidden;
        }
        .bg-deco .bg-en {
            position: absolute; top: 8%; left: 3%; font-size: 16vw;
            font-weight: 900; line-height: 0.85; letter-spacing: -0.04em;
            text-transform: uppercase; color: rgba(10, 10, 10, 0.20);
            transform: skewX(-8deg); white-space: nowrap;
        }
        .bg-deco .bg-icon {
            position: absolute; bottom: 10%; right: 5%; width: 20vw; height: 20vw;
            color: rgba(10, 10, 10, 0.06); transform: rotate(8deg);
        }
        .bg-deco .bg-icon svg { width: 100%; height: 100%; display: block; }

        .login-wrapper {
            flex: 1; display: flex; align-items: center; justify-content: center;
            padding: 100px 20px 80px; position: relative; overflow: hidden;
        }
        .login-card {
            position: relative; z-index: 1;
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            border: 3px solid var(--border); padding: 50px 60px;
            max-width: 440px; width: 100%; box-shadow: var(--shadow);
        }
        .login-card .brand-icon {
            font-size: 48px; line-height: 1; margin-bottom: 12px; display: block;
        }
        .login-card h2 { font-size: 28px; letter-spacing: -1px; margin-bottom: 4px; }
        .login-card .sub {
            font-size: 14px; font-weight: 700; color: #666;
            text-transform: uppercase; letter-spacing: 1px; margin-bottom: 30px;
        }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block; font-size: 12px; font-weight: 900;
            text-transform: uppercase; letter-spacing: 1px;
            margin-bottom: 6px; color: var(--text);
        }
        .form-group input {
            width: 100%; padding: 12px 16px;
            border: 3px solid var(--border); background: var(--bg);
            font-size: 15px; font-weight: 700; font-family: inherit;
            color: var(--text); outline: none; transition: border-color 0.1s;
        }
        .form-group input:focus { border-color: var(--accent); }
        .btn-login {
            width: 100%; padding: 14px; background: var(--text); color: var(--bg);
            border: 3px solid var(--border); font-size: 14px; font-weight: 900;
            text-transform: uppercase; letter-spacing: 2px; cursor: pointer;
            font-family: inherit; transition: transform 0.1s, box-shadow 0.1s;
            margin-bottom: 24px;
        }
        .btn-login:hover { transform: translate(-3px, -3px); box-shadow: 6px 6px 0px var(--border); }
        .register-link {
            text-align: center; font-size: 13px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.5px; color: #666;
        }
        .register-link a {
            color: var(--text); text-decoration: none;
            border-bottom: 3px solid var(--accent); transition: opacity 0.1s;
        }
        .register-link a:hover { opacity: 0.6; }

        .msg {
            padding: 10px 14px; margin-bottom: 20px; font-size: 13px;
            font-weight: 800; border: 3px solid var(--border); text-align: center;
        }
        .msg.error { background: rgba(255, 26, 26, 0.1); border-color: var(--accent); color: var(--accent); }

        .footer {
            border-top: 3px solid var(--border); padding: 30px 40px;
            display: flex; justify-content: space-between; font-size: 12px;
            font-weight: 900; text-transform: uppercase; background: var(--text);
            color: var(--bg); flex-shrink: 0;
        }

        @media (max-width: 900px) {
            .nav { padding: 0 20px; }
            .nav-links { gap: 16px; font-size: 10px; }
            .login-card { padding: 30px 24px; }
            .login-card h2 { font-size: 24px; }
            .bg-deco .bg-en { font-size: 22vw; top: 6%; left: 2%; }
            .bg-deco .bg-icon { width: 30vw; height: 30vw; bottom: 5%; right: -2%; }
            .login-wrapper { padding: 80px 16px 60px; }
            .footer { flex-direction: column; gap: 8px; align-items: center; text-align: center; padding: 20px; }
        }
    </style>
</head>
<body>

<nav class="nav">
    <a href="index.html" class="nav-logo">Courtside</a>
    <div class="nav-links">
        <a href="index.html">首页</a>
        <a href="register.html" class="active">注册</a>
    </div>
</nav>

<main class="login-wrapper">
    <div class="bg-deco">
        <div class="bg-en">JOIN</div>
        <div class="bg-icon">
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="46" stroke="currentColor" stroke-width="4"/>
                <path d="M50 4 V96 M4 50 H96" stroke="currentColor" stroke-width="3"/>
                <circle cx="50" cy="50" r="16" stroke="currentColor" stroke-width="3" fill="none"/>
                <circle cx="50" cy="50" r="6" fill="currentColor"/>
            </svg>
        </div>
    </div>

    <div class="login-card">
        <span class="brand-icon">🏀</span>
        <h2>加入我们</h2>
        <p class="sub">创建你的账号</p>

        <div id="msgBox"></div>

        <form action="/register" method="POST">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" placeholder="请输入显示名称" required>
            </div>
            <div class="form-group">
                <label for="account">账号</label>
                <input type="text" id="account" name="account" placeholder="请输入登录账号" required>
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" placeholder="请输入密码" required>
            </div>

            <button type="submit" class="btn-login">注 册</button>
        </form>

        <div class="register-link">
            已有账号？ <a href="login.html">立即登录</a>
        </div>
    </div>
</main>

<footer class="footer">
    <span>© 2026 COURTSIDE</span>
    <span>不止于篮球</span>
</footer>

<script>
    var params = new URLSearchParams(location.search);
    var msgBox = document.getElementById('msgBox');
    if (params.get('error') === 'account_exists') {
        msgBox.innerHTML = '<div class="msg error">账号已被占用</div>';
    }
</script>

</body>
</html>
