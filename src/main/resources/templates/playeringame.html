<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COURTSIDE — 球员详情</title>
    <script src="/js/jquery-1.8.3.js"></script>
    <script src="/js/playeringame.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg: #f4f4f4;
            --text: #0a0a0a;
            --accent: #ff1a1a;
            --card-bg: #ffffff;
            --border: #0a0a0a;
            --shadow: 8px 8px 0px rgba(0, 0, 0, 0.06);
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: "Helvetica Neue", Arial, "PingFang SC", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* ===== 导航栏 ===== */
        .top-nav {
            position: sticky;
            top: 0;
            z-index: 100;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            background: var(--bg);
            border-bottom: 3px solid var(--border);
        }
        .nav-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 120px;
        }
        .nav-back {
            font-size: 13px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-decoration: none;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            border: 3px solid var(--border);
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .nav-back:hover {
            transform: translate(-2px, -2px);
            box-shadow: 4px 4px 0px var(--border);
        }
        .nav-center {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: 15px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .nav-right {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 120px;
            justify-content: flex-end;
        }
        .nav-brand {
            font-size: 16px;
            font-weight: 900;
            letter-spacing: -1px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .nav-brand::before {
            content: '';
            width: 8px;
            height: 8px;
            background: var(--accent);
            transform: skewX(-15deg);
        }

        /* ===== 板块入口标识 ===== */
        .section-entry {
            position: relative;
            padding: 40px 5vw 20px;
            background: var(--bg);
            margin-top: 0;
            overflow: visible;
            z-index: 1;
        }
        .section-entry .entry-title {
            display: flex;
            align-items: baseline;
            gap: 16px;
            margin-bottom: 10px;
        }
        .section-entry .entry-title h2 {
            font-size: 28px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -1px;
            color: var(--text);
        }
        .section-entry .entry-title span {
            font-size: 11px;
            font-weight: 600;
            color: #666;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .section-entry .entry-divider {
            width: 100%;
            height: 3px;
            background: var(--border);
        }

        .bg-deco {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: visible;
        }
        .bg-deco .bg-en {
            position: absolute;
            top: 8%;
            left: 5%;
            font-size: 10vw;
            font-weight: 900;
            line-height: 0.85;
            letter-spacing: -0.04em;
            text-transform: uppercase;
            color: rgba(10, 10, 10, 0.08);
            transform: skewX(-6deg);
        }
        .bg-deco .bg-icon {
            position: absolute;
            top: -5%;
            right: 5%;
            width: 16vw;
            height: 16vw;
            color: rgba(10, 10, 10, 0.08);
            transform: rotate(8deg);
        }
        .bg-deco .bg-icon svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 40px 100px;
        }

        /* ===== 球员信息卡片 ===== */
        .player-header {
            display: flex;
            align-items: center;
            gap: 40px;
            padding: 40px;
            background: var(--card-bg);
            border: 3px solid var(--border);
            box-shadow: var(--shadow);
            margin-bottom: 30px;
        }
        .player-avatar {
            font-size: 80px;
            line-height: 1;
            flex-shrink: 0;
        }
        .player-info h1 {
            font-size: 36px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -1px;
            margin-bottom: 4px;
        }
        .player-info .player-meta {
            font-size: 14px;
            font-weight: 800;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        .player-info .player-meta span {
            margin: 0 8px;
            color: #ccc;
        }
        .player-info .player-season-avg {
            font-size: 14px;
            font-weight: 800;
            color: #333;
            letter-spacing: 0.5px;
        }
        .player-info .player-season-avg strong {
            color: var(--text);
            font-size: 16px;
        }

        /* ===== 本场比赛数据 ===== */
        .game-stats {
            background: var(--card-bg);
            border: 3px solid var(--border);
            padding: 30px 40px;
            margin-bottom: 30px;
            box-shadow: var(--shadow);
        }
        .game-stats-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 12px;
            text-align: center;
        }
        .game-stats-grid .stat-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .game-stats-grid .stat-item .stat-label {
            font-size: 10px;
            font-weight: 800;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .game-stats-grid .stat-item .stat-value {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: -1px;
            color: var(--text);
        }

        /* ===== 评分区 ===== */
        .rating-section {
            background: var(--card-bg);
            border: 3px solid var(--border);
            padding: 30px 40px;
            margin-bottom: 30px;
            box-shadow: var(--shadow);
        }
        .rating-section .rating-your {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 12px;
            font-size: 16px;
            font-weight: 800;
        }
        .rating-section .rating-your .stars {
            font-size: 36px;
            line-height: 1;
            letter-spacing: 4px;
            color: #ddd;
            cursor: pointer;
            user-select: none;
        }
        .rating-section .rating-your .stars .star-active {
            color: #f5a623;
        }
        .rating-section .rating-your .rating-tip {
            font-size: 13px;
            font-weight: 800;
            color: var(--accent);
            margin-left: 8px;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .rating-section .rating-your .rating-tip.show {
            opacity: 1;
        }
        .rating-section .rating-avg {
            font-size: 13px;
            font-weight: 700;
            color: #666;
            letter-spacing: 0.5px;
            padding-top: 12px;
            border-top: 2px solid var(--bg);
        }
        .rating-section .rating-avg strong {
            color: var(--text);
            font-size: 15px;
        }

        /* ===== 发表评论 ===== */
        .comment-form {
            background: var(--card-bg);
            border: 3px solid var(--border);
            padding: 30px 40px;
            margin-bottom: 30px;
            box-shadow: var(--shadow);
        }
        .comment-form .form-row {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 10px;
        }
        .comment-form .form-row label {
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            flex-shrink: 0;
        }
        .comment-form textarea {
            width: 100%;
            padding: 14px 18px;
            border: 3px solid var(--border);
            font-size: 14px;
            font-weight: 700;
            font-family: inherit;
            background: var(--bg);
            resize: vertical;
            min-height: 70px;
            outline: none;
            transition: border-color 0.1s;
        }
        .comment-form textarea:focus {
            border-color: var(--accent);
        }
        .comment-form .form-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 14px;
        }
        .comment-form .btn-submit {
            padding: 10px 32px;
            background: var(--text);
            color: var(--bg);
            border: 3px solid var(--border);
            font-size: 13px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            font-family: inherit;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .comment-form .btn-submit:hover {
            transform: translate(-2px, -2px);
            box-shadow: 4px 4px 0px var(--border);
        }

        /* ===== 评论列表 ===== */
        .comment-list {
            background: var(--card-bg);
            border: 3px solid var(--border);
            padding: 30px 40px;
            box-shadow: var(--shadow);
        }
        .comment-list .comment-item {
            display: flex;
            gap: 16px;
            padding: 18px 0;
            border-bottom: 2px solid var(--bg);
        }
        .comment-list .comment-item:last-child {
            border-bottom: none;
        }
        .comment-list .comment-item .c-avatar {
            font-size: 32px;
            line-height: 1;
            flex-shrink: 0;
            margin-top: 2px;
        }
        .comment-list .comment-item .c-body {
            flex: 1;
        }
        .comment-list .comment-item .c-body .c-head {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 4px;
        }
        .comment-list .comment-item .c-body .c-head .c-name {
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .comment-list .comment-item .c-body .c-head .c-time {
            font-size: 11px;
            font-weight: 700;
            color: #999;
            margin-left: auto;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .comment-list .comment-item .c-body .c-text {
            font-size: 14px;
            font-weight: 700;
            color: #444;
            line-height: 1.6;
        }
        .load-more {
            text-align: center;
            padding: 20px 0 4px;
        }
        .load-more a {
            font-size: 13px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #999;
            text-decoration: none;
            padding: 8px 24px;
            border: 3px solid #ddd;
            transition: all 0.1s;
        }
        .load-more a:hover {
            color: var(--text);
            border-color: var(--border);
        }

        .footer {
            border-top: 3px solid var(--border);
            padding: 40px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: 900;
            text-transform: uppercase;
            background: var(--text);
            color: var(--bg);
            margin-top: 80px;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @media (max-width: 900px) {
            .top-nav { padding: 0 20px; }
            .nav-center {
                font-size: 11px;
                position: static;
                transform: none;
                flex: 1;
                text-align: center;
            }
            .nav-left, .nav-right { min-width: auto; }
            .nav-back { font-size: 11px; padding: 4px 12px; }
            .container { padding: 0 20px 60px; }
            .player-header {
                flex-direction: column;
                text-align: center;
                padding: 30px 20px;
                gap: 20px;
            }
            .player-info h1 { font-size: 28px; }
            .game-stats-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 16px;
            }
            .game-stats { padding: 20px; }
            .rating-section { padding: 20px; }
            .comment-form { padding: 20px; }
            .comment-list { padding: 20px; }
            .comment-form .form-row { flex-wrap: wrap; }
            .comment-list .comment-item .c-body .c-head { flex-wrap: wrap; }
            .comment-list .comment-item .c-body .c-head .c-time {
                margin-left: 0;
                width: 100%;
            }
            .rating-section .rating-your { flex-wrap: wrap; }
            .section-entry .entry-title h2 { font-size: 20px; }
            .bg-deco .bg-icon { width: 22vw; height: 22vw; }
            .bg-deco .bg-en { font-size: 14vw; }
        }
    </style>
</head>
<body>
<div id="loadingWrapper" style="position:fixed;top:0;left:0;width:100%;height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;background:var(--bg);z-index:999;">
    <div style="font-size:64px;animation:bounce 1s ease-in-out infinite;">🏀</div>
    <div style="font-size:16px;font-weight:900;text-transform:uppercase;letter-spacing:4px;color:#999;margin-top:16px;">加载球员数据...</div>
</div>
<div id="pageContent" style="display:none;">

    <nav class="top-nav">
        <div class="nav-left">
            <a href="javascript:history.back()" class="nav-back">← 返回</a>
        </div>
        <div class="nav-center">
            <span class="nav-title" id="playerNameNav">球员</span>
        </div>
        <div class="nav-right">
            <span class="nav-brand">Courtside</span>
        </div>
    </nav>

    <section class="section-entry" style="margin-top:0; position:relative; overflow:visible;">
        <div class="bg-deco">
            <div class="bg-en">PLAYER</div>
            <div class="bg-icon">
                <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="50" cy="50" r="46" stroke="currentColor" stroke-width="4"/>
                    <path d="M50 4 V96 M4 50 H96" stroke="currentColor" stroke-width="3"/>
                    <circle cx="50" cy="50" r="16" stroke="currentColor" stroke-width="3" fill="none"/>
                    <circle cx="50" cy="50" r="6" fill="currentColor"/>
                </svg>
            </div>
        </div>
        <div class="entry-title">
            <h2>球员详情</h2>
            <span>数据 · 评分 · 评论</span>
        </div>
        <div class="entry-divider"></div>
    </section>

    <div class="container">


        <div class="player-header">
            <div class="player-avatar">🏀</div>
            <div class="player-info">
                <h1 id="playerName">--</h1>
                <div class="player-meta" id="playerMeta">--</div>
                <div class="player-season-avg" id="seasonAvg">加载中...</div>
            </div>
        </div>


        <div class="game-stats">
            <div class="game-stats-grid">
                <div class="stat-item">
                    <span class="stat-label">得分</span>
                    <span class="stat-value" id="statPts">--</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">篮板</span>
                    <span class="stat-value" id="statReb">--</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">助攻</span>
                    <span class="stat-value" id="statAst">--</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">抢断</span>
                    <span class="stat-value" id="statStl">--</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">盖帽</span>
                    <span class="stat-value" id="statBlk">--</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">投篮</span>
                    <span class="stat-value" id="statFg">--</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">三分</span>
                    <span class="stat-value" id="statFg3">--</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">罚球</span>
                    <span class="stat-value" id="statFt">--</span>
                </div>
            </div>
        </div>


        <div class="rating-section">
            <div class="rating-your">
                你的评分：
                <span class="stars" id="userStars">
                    <span>★</span><span>★</span><span>★</span><span>★</span><span>★</span>
                </span>
                <span class="rating-tip" id="ratingTip"></span>
            </div>
            <div class="rating-avg">
                场均评分 <strong id="avgRating">--</strong> · 基于 <strong id="ratingCount">--</strong> 位用户
            </div>
        </div>


        <div class="comment-form">
            <div class="form-row">
                <label>评论</label>
            </div>
            <textarea id="commentInput" placeholder="说点什么吧..."></textarea>
            <div class="form-actions">
                <button class="btn-submit" id="submitComment">发布</button>
            </div>
        </div>


        <div class="comment-list" id="commentList">
            <div style="text-align:center;padding:20px;color:#999;font-weight:700;">暂无评论，快来发表你的看法吧！</div>
        </div>

    </div>

    <footer class="footer">
        <span>© 2026 COURTSIDE</span>
        <span>不止于篮球</span>
    </footer>

</div>

</body>
</html>
