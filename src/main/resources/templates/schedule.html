<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <script src="/js/jquery-1.8.3.js"></script>
    <script src="/js/schedule.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COURTSIDE — 赛程</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #f4f4f4;
            --text: #0a0a0a;
            --accent: #ff1a1a;
            --card-bg: #ffffff;
            --border: #0a0a0a;
            --shadow: 8px 8px 0px rgba(0,0,0,0.06);
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: "Helvetica Neue", Arial, "PingFang SC", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .top-nav {
            position: sticky; top: 0; z-index: 100;
            height: 60px; display: flex; align-items: center;
            justify-content: space-between; padding: 0 40px;
            background: var(--bg); border-bottom: 3px solid var(--border);
        }
        .nav-back {
            font-size: 13px; font-weight: 900; text-transform: uppercase;
            letter-spacing: 1px; text-decoration: none; color: var(--text);
            padding: 6px 16px; border: 3px solid var(--border);
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .nav-back:hover {
            transform: translate(-2px, -2px);
            box-shadow: 4px 4px 0px var(--border);
        }
        .nav-center {
            position: absolute; left: 50%; transform: translateX(-50%);
            font-size: 15px; font-weight: 900; text-transform: uppercase;
            letter-spacing: 1px;
        }
        .nav-brand {
            font-size: 16px; font-weight: 900; letter-spacing: -1px;
            text-transform: uppercase; display: flex; align-items: center; gap: 6px;
        }
        .nav-brand::before {
            content: ''; width: 8px; height: 8px;
            background: var(--accent); transform: skewX(-15deg);
        }

        .section-entry {
            position: relative; padding: 40px 5vw 20px;
            background: var(--bg); overflow: visible; z-index: 1;
        }
        .section-entry .entry-title {
            display: flex; align-items: baseline; gap: 16px; margin-bottom: 10px;
        }
        .section-entry .entry-title h2 {
            font-size: 28px; font-weight: 900; text-transform: uppercase;
            letter-spacing: -1px;
        }
        .section-entry .entry-title span {
            font-size: 11px; font-weight: 600; color: #666;
            letter-spacing: 2px; text-transform: uppercase;
        }
        .section-entry .entry-divider {
            width: 100%; height: 3px; background: var(--border);
        }

        .bg-deco {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0; overflow: visible;
        }
        .bg-deco .bg-en {
            position: absolute; top: 8%; left: 5%; font-size: 10vw;
            font-weight: 900; line-height: 0.85; letter-spacing: -0.04em;
            text-transform: uppercase; color: rgba(10,10,10,0.08);
            transform: skewX(-6deg);
        }

        .container {
            max-width: 1000px; margin: 0 auto; padding: 0 40px 80px;
        }

        /* ===== 日期导航 ===== */
        .date-nav {
            display: flex; align-items: center; justify-content: center;
            gap: 16px; padding: 30px 0; margin-bottom: 30px;
            border-bottom: 3px solid var(--border);
        }
        .date-btn {
            padding: 10px 20px; background: var(--text); color: var(--bg);
            border: 3px solid var(--border); font-size: 13px; font-weight: 900;
            text-transform: uppercase; letter-spacing: 1px; cursor: pointer;
            font-family: inherit; transition: transform 0.1s, box-shadow 0.1s;
        }
        .date-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 4px 4px 0px var(--border);
        }
        .date-btn:disabled {
            opacity: 0.3; cursor: not-allowed;
            transform: none; box-shadow: none;
        }
        .date-display {
            font-size: 22px; font-weight: 900; text-transform: uppercase;
            letter-spacing: 1px; min-width: 200px; text-align: center;
            padding: 8px 24px; border: 3px solid var(--border);
            background: var(--card-bg);
        }
        .date-input {
            padding: 8px 12px; border: 3px solid var(--border);
            font-size: 14px; font-weight: 700; font-family: inherit;
            background: var(--card-bg); color: var(--text);
        }

        /* ===== 比赛列表 ===== */
        .game-list {
            display: flex; flex-direction: column; gap: 16px;
        }
        .game-card {
            background: var(--card-bg); border: 3px solid var(--border);
            padding: 24px 32px; display: grid;
            grid-template-columns: 1fr auto 1fr auto;
            align-items: center; gap: 24px;
            cursor: pointer; transition: transform 0.1s, box-shadow 0.1s;
        }
        .game-card:hover {
            transform: translate(-3px, -3px);
            box-shadow: 8px 8px 0px var(--border);
        }
        .team-side {
            display: flex; flex-direction: column; gap: 4px;
        }
        .team-side.right { text-align: right; align-items: flex-end; }
        .team-side .team-name {
            font-size: 20px; font-weight: 900; text-transform: uppercase;
            letter-spacing: -0.5px;
        }
        .team-side .team-score {
            font-size: 36px; font-weight: 900; font-style: italic;
            letter-spacing: -1px;
        }
        .team-side .team-score.win { color: var(--accent); }
        .vs-mid {
            font-size: 14px; font-weight: 900; color: #ccc;
            font-style: italic; padding: 0 8px;
        }
        .game-status {
            font-size: 10px; font-weight: 900; text-transform: uppercase;
            letter-spacing: 1px; padding: 4px 12px;
            border: 2px solid var(--border); transform: skewX(-8deg);
            white-space: nowrap;
        }
        .game-status.live { background: var(--accent); color: #fff; border-color: var(--accent); }
        .game-status.final { color: #999; }
        .game-status.scheduled { color: #666; }

        .empty, .loading {
            text-align: center; padding: 60px 20px;
            font-size: 16px; font-weight: 900; color: #999;
            text-transform: uppercase; letter-spacing: 2px;
        }
        .loading .ball {
            font-size: 48px; display: inline-block;
            animation: bounce 1s ease-in-out infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .footer {
            border-top: 3px solid var(--border); padding: 40px;
            display: flex; justify-content: space-between;
            font-size: 12px; font-weight: 900; text-transform: uppercase;
            background: var(--text); color: var(--bg); margin-top: 80px;
        }

        @media (max-width: 900px) {
            .top-nav { padding: 0 20px; }
            .nav-center { font-size: 11px; }
            .container { padding: 0 20px 60px; }
            .date-nav { flex-wrap: wrap; gap: 8px; }
            .date-display { font-size: 16px; min-width: auto; padding: 6px 16px; }
            .game-card { grid-template-columns: 1fr; gap: 12px; text-align: center; }
            .team-side.right { text-align: center; align-items: center; }
            .team-side { align-items: center; }
        }
    </style>
</head>
<body>

<nav class="top-nav">
    <a href="/index" class="nav-back">← 首页</a>
    <div class="nav-center">
        <span class="nav-title">赛程</span>
    </div>
    <span class="nav-brand">Courtside</span>
</nav>

<section class="section-entry" style="position:relative; overflow:visible;">
    <div class="bg-deco">
        <div class="bg-en">SCHEDULE</div>
    </div>
    <div class="entry-title">
        <h2>赛程</h2>
        <span>按日期查询 · 历史与近期</span>
    </div>
    <div class="entry-divider"></div>
</section>

<div class="container">

    <div class="date-nav">
        <button class="date-btn" id="prevDay">← 前一天</button>
        <span class="date-display" id="dateDisplay">--</span>
        <button class="date-btn" id="nextDay">后一天 →</button>
    </div>

    <div style="text-align:center; margin-bottom:24px;">
        <input type="date" class="date-input" id="datePicker">
    </div>

    <div class="game-list" id="gameList">
        <div class="loading">
            <div class="ball">🏀</div>
            <div style="margin-top:12px;">加载中...</div>
        </div>
    </div>

</div>

<footer class="footer">
    <span>© 2026 COURTSIDE</span>
    <span>不止于篮球</span>
</footer>

</body>
</html>
